[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    compilation: Firmware build and Python syntax tests
    control: Fly-By-Wire PI-D, kinematics, and flaperon control tests
    telemetry: Telemetry packet encoding, decoding, CRC16 and logger tests
    safety: Failsafes, soft power ceiling, and SysID sensor alignment tests
    sensors: Battery voltage sensor and IMU quality ground truth tests
