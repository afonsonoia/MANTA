name: MANTA CI/CD - Ground Truth Verification

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-voltage-accuracy:
    name: Validate ESP32 Voltage Formula vs Multimeter Ground Truth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openpyxl

      - name: Run CI/CD Ground Truth Accuracy Tests
        run: |
          python run_tests.py
