name: MANTA CI/CD - Ground Truth Verification

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-voltage-accuracy:
    name: Validate ESP32 Voltage Formula vs Multimeter Ground Truth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core & Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openpyxl platformio

      - name: Run CI/CD Compilation and Accuracy Test Suite
        run: |
          python run_tests.py

